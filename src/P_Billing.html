<!-- P_Billing.html - หน้า วางบิล/ออกเอกสาร (Billing) -->
<script>
// ===== เปิดรายละเอียดใบสั่งจ้าง+จัดการเอกสาร =====
function openBillingOrder(orderId) {
  callServerArgs('getOrderDetail', orderId).then(function (res) {
    var data = res.data;
    var order = data.order;
    var items = data.items;

    // ดึงเอกสารที่ออกไปแล้วของ order นี้
    callServerArgs('listDocuments', { order_id: orderId }).then(function (dres) {
      var docs = dres.data || [];
      renderBillingOrderModal(order, items, docs);
    }).catch(function (e) { toast(e.message, 'error'); });
  }).catch(function (e) { toast(e.message, 'error'); });
}

function renderBillingOrderModal(order, items, docs) {
  var docBtns = '';
  var locked = ['PARTIAL_PAID', 'PAID'].indexOf(order.status) >= 0 || hasReceipt(docs);

  var canBill = ['DELIVERED', 'CONFIRMED', 'IN_PRODUCTION', 'BILLED'].indexOf(order.status) >= 0;
  var canReceipt = ['BILLED', 'PARTIAL_PAID'].indexOf(order.status) >= 0 && Number(order.balance) <= 0.01 && !locked;

  if (canBill) {
    docBtns += '<button class="btn btn-primary" id="b-bill">ออกใบวางบิล (BN)</button> ';
  }
  docBtns += '<button class="btn btn-secondary" id="b-delivery">ใบส่งของ (DO)</button> ';
  if (canReceipt && !hasReceipt(docs)) {
    docBtns += '<button class="btn btn-success" id="b-receipt">ออกใบเสร็จ (RC)</button> ';
  }
  if (hasReceipt(docs)) {
    docBtns += '<span class="badge badge-paid">ล็อกแล้ว (มีใบเสร็จ)</span> ';
  }

  var docsTable = docs.length ? '<h4 style="margin:14px 0 8px">เอกสารที่ออกแล้ว</h4><div class="table-wrap"><table class="data"><thead><tr><th>เลขที่</th><th>ประเภท</th><th>วันที่</th><th>พิมพ์</th><th>ยกเลิก</th></tr></thead><tbody>' +
    docs.map(function (d) {
      var typeName = { QUOTATION: 'ใบเสนอราคา', DELIVERY: 'ใบส่งของ', BILLING: 'ใบวางบิล', RECEIPT: 'ใบเสร็จ', TAX_INVOICE: 'ใบกำกับภาษี' }[d.doc_type] || d.doc_type;
      var printBtn = d.status === 'ACTIVE' ? '<button class="btn btn-secondary btn-sm" onclick="printDoc(\'' + esc(d.id) + '\')">🖨️ พิมพ์</button>' : '<span class="badge badge-cancelled">' + d.status + '</span>';
      var cancelBtn = d.status === 'ACTIVE' ? '<button class="btn btn-danger btn-sm" onclick="cancelDocPrompt(\'' + esc(d.id) + '\',\'' + esc(d.doc_no) + '\')">ยกเลิก</button>' : '';
      return '<tr><td>' + esc(d.doc_no) + '</td><td>' + typeName + '</td><td>' + esc(d.issue_date) + '</td><td>' + printBtn + '</td><td>' + cancelBtn + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '';

  var html = '<div style="text-align:left">' +
    '<p><strong>' + esc(order.doc_no) + '</strong> — ' + badgeFor(order.status) + '</p>' +
    '<p><strong>ลูกค้า:</strong> ' + esc(order.customer_name) + '</p>' +
    '<p><strong>ยอดรวม:</strong> ฿' + fmtMoney(order.grand_total) + ' | <strong>ชำระแล้ว:</strong> ฿' + fmtMoney(order.paid_total) + ' | <strong>คงค้าง:</strong> ฿' + fmtMoney(order.balance) + '</p>' +
    '<div style="margin:12px 0">' + docBtns + '</div>' +
    docsTable +
    '</div>';

  Swal.fire({
    title: 'จัดการเอกสาร ' + order.doc_no,
    html: html,
    width: 760,
    showCloseButton: true,
    showConfirmButton: false,
    didOpen: function () {
      var btn = document.getElementById('b-bill');
      if (btn) btn.onclick = function () { issueDocType(order.id, 'BILLING'); };
      var dlv = document.getElementById('b-delivery');
      if (dlv) dlv.onclick = function () { issueDocType(order.id, 'DELIVERY'); };
      var rc = document.getElementById('b-receipt');
      if (rc) rc.onclick = function () { issueDocType(order.id, 'RECEIPT'); };
    }
  });
}

function hasReceipt(docs) {
  return docs.some(function (d) {
    return ['RECEIPT', 'TAX_INVOICE'].indexOf(d.doc_type) >= 0 && d.status === 'ACTIVE';
  });
}

// ===== ออกเอกสาร =====
function issueDocType(orderId, docType) {
  callServerArgs('issueDocument', orderId, docType).then(function (res) {
    if (res && res.ok) {
      toast('ออกเอกสาร ' + res.data.doc_no + ' สำเร็จ', 'success');
      var printBtn = '<button class="btn btn-primary" id="print-now">🖨️ พิมพ์เอกสาร</button>';
      Swal.fire({
        title: 'ออกเอกสารสำเร็จ',
        html: '<p>' + esc(res.data.doc_no) + ' (' + esc(docType) + ')</p>' + printBtn,
        showCloseButton: true,
        showConfirmButton: false,
        didOpen: function () {
          var pb = document.getElementById('print-now');
          if (pb) pb.onclick = function () { printDoc(res.data.id); };
        }
      });
      navigate('billing');
    } else {
      toast((res && res.message) || 'เกิดข้อผิดพลาด', 'error');
    }
  }).catch(function (e) { toast(e.message, 'error'); });
}

// ===== ยกเลิกเอกสาร (cascade) =====
function cancelDocPrompt(docId, docNo) {
  openCancelModal({
    title: 'ยกเลิก ' + docNo,
    onConfirm: function (reason) {
      callServerArgs('cancelFromDocument', docId, reason).then(function (res) {
        if (res && res.ok) {
          toast('ยกเลิก ' + docNo + ' สำเร็จ (VOID ทั้งสาย)', 'success');
          navigate('billing');
        } else {
          toast((res && res.message) || 'ยกเลิกไม่สำเร็จ', 'error');
        }
      }).catch(function (e) { toast(e.message, 'error'); });
    }
  });
}

// ===== พิมพ์เอกสาร (เปิด popup A4) =====
function saveNewCustomer() {
  var name = document.getElementById('nc-name');
  if (!name) return;
  var payload = {
    name: name.value.trim(),
    customer_type: document.getElementById('nc-type').value,
    phone: document.getElementById('nc-phone') ? document.getElementById('nc-phone').value : '',
    tax_id: document.getElementById('nc-tax') ? document.getElementById('nc-tax').value : '',
    credit_days: document.getElementById('nc-credit') ? document.getElementById('nc-credit').value : 0,
    address: document.getElementById('nc-addr') ? document.getElementById('nc-addr').value : ''
  };
  if (!payload.name) { toast('กรุณากรอกชื่อลูกค้า', 'error'); return; }
  callServerArgs('createCustomer', payload).then(function (res) {
    if (res && res.ok) {
      toast('สร้างลูกค้า ' + res.data.code + ' สำเร็จ', 'success');
      setTimeout(function () { navigate('settings'); }, 600);
    } else {
      toast((res && res.message) || 'สร้างลูกค้าไม่สำเร็จ', 'error');
    }
  }).catch(function (e) { toast(e.message, 'error'); });
}

function manualBackup() {
  callServerArgs('manualBackup', {}).then(function (res) {
    if (res && res.ok) {
      toast(res.message || 'สำรองข้อมูลสำเร็จ', 'success');
    } else {
      toast((res && res.message) || 'สำรองข้อมูลไม่สำเร็จ', 'error');
    }
  }).catch(function (e) { toast(e.message, 'error'); });
}

// ===== พิมพ์เอกสาร (เปิด popup A4) =====
function printDoc(docId) {
  callServerArgs('getDocument', docId).then(function (res) {
    if (!res || !res.ok || !res.data) { toast('ไม่พบเอกสาร', 'error'); return; }
    var doc = res.data;
    callServerArgs('printDocument', docId).then(function (pres) {
      if (res.data.snapshot) {
        renderPrintPopup(doc);
      } else {
        doc.snapshot = res.data.snapshot;
        renderPrintPopup(doc);
      }
    }).catch(function () { renderPrintPopup(doc); });
  }).catch(function (e) { toast(e.message, 'error'); });
}

function renderPrintPopup(doc) {
  var snap = doc.snapshot || {};
  var order = snap.order || {};
  var items = snap.items || [];

  var typeName = { QUOTATION: 'ใบเสนอราคา', DELIVERY: 'ใบส่งของ', BILLING: 'ใบวางบิล', RECEIPT: 'ใบเสร็จรับเงิน', TAX_INVOICE: 'ใบกำกับภาษี' }[doc.doc_type] || 'เอกสาร';
  var watermark = doc.status === 'VOID' ? '<div class="wm">ยกเลิก</div>' : '';
  var rows = items.map(function (it) {
    return '<tr><td>' + esc(it.line_no || '') + '</td><td>' + esc(it.description) + '</td><td>' + esc(it.qty) + '</td><td>' + esc(it.area_sqm) + ' ตร.ม.</td><td>' + fmtMoney(it.unit_price) + '</td><td>' + fmtMoney(it.line_total) + '</td></tr>';
  }).join('');

  var html = '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>' + typeName + '</title>' +
    '<style>' +
    '@page { size: A4; margin: 12mm; }' +
    '* { box-sizing: border-box; margin: 0; padding: 0; }' +
    'body { font-family: "Sarabun", sans-serif; color: #111; padding: 20px; }' +
    '.wm { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%) rotate(-30deg); font-size: 90px; color: rgba(220,38,38,.18); font-weight: 800; z-index: 99; pointer-events: none; }' +
    '.hdr { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; }' +
    '.title { font-size: 26px; font-weight: 700; }' +
    'table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }' +
    'th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; }' +
    'th { background: #f1f5f9; }' +
    '.tot { text-align: right; margin-top: 12px; line-height: 1.7; }' +
    '.no-print { margin-bottom: 14px; padding: 10px 16px; background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }' +
    '</style></head><body>' +
    '<button class="no-print" onclick="window.print()">🖨️ พิมพ์เอกสาร</button>' +
    watermark +
    '<div class="hdr"><div><div class="title">' + typeName + '</div><div>ร้านไวนิล</div></div><div style="text-align:right"><strong>' + esc(doc.doc_no) + '</strong><br>' + esc(doc.issue_date || '') + '</div></div>' +
    '<p><strong>ลูกค้า:</strong> ' + esc(order.customer_name || '') + '</p>' +
    '<table><thead><tr><th>#</th><th>รายการ</th><th>จำนวน</th><th>พื้นที่</th><th>ราคา</th><th>รวม</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tot">' +
    '<p>รวม: ฿' + fmtMoney(order.subtotal) + '</p>' +
    '<p>ภาษี: ฿' + fmtMoney(order.vat_amount) + '</p>' +
    '<p>หัก ณ ที่จ่าย: ฿' + fmtMoney(order.wht_amount) + '</p>' +
    '<p><strong>สุทธิ: ฿' + fmtMoney(doc.total_amount != null ? doc.total_amount : order.grand_total) + '</strong></p>' +
    '</div>' +
    '<p style="margin-top:12px"><strong>กำหนดชำระ:</strong> ' + esc(doc.due_date || order.due_date || '') + '</p>' +
    '</body></html>';

  var w = window.open('', '_blank');
  if (!w) { toast('กรุณาอนุญาตให้เปิดหน้าต่างใหม่', 'error'); return; }
  w.document.write(html);
  w.document.close();
}
</script>
