<!-- P_Audit.html - หน้าตรวจสอบย้อนหลัง (Audit Log) -->
<script>
// init หน้าเมื่อ renderAudit โหลดแล้ว
function initAuditPage() {
  var kw = document.getElementById('audit-keyword');
  if (kw) {
    kw.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loadAuditLogs();
    });
  }
}

// โหลด AuditLog ตาม filter
function loadAuditLogs() {
  var box = document.getElementById('audit-result');
  if (!box) return;

  var action = document.getElementById('audit-action') ? document.getElementById('audit-action').value : '';
  var keyword = document.getElementById('audit-keyword') ? document.getElementById('audit-keyword').value.trim() : '';

  box.innerHTML = '<p>โหลด...</p>';
  callServerArgs('listAuditLogs', { action: action, keyword: keyword, limit: 200 }).then(function (res) {
    var logs = res.data || [];
    if (!logs.length) {
      box.innerHTML = '<p style="color:var(--text-muted)">ไม่พบประวัติ</p>';
      return;
    }
    var rows = logs.map(function (l) {
      var actionLabel = {
        CREATE: 'สร้าง', UPDATE: 'แก้ไข', STATUS_CHANGE: 'เปลี่ยนสถานะ', ISSUE_DOC: 'ออกเอกสาร',
        PAYMENT: 'รับชำระ', VOID: 'ยกเลิก(VOID)', CANCEL: 'ยกเลิก', PRINT: 'พิมพ์', LOGIN: 'เข้าสู่ระบบ'
      }[l.action] || l.action;
      var fields = (l.changed_fields_arr && l.changed_fields_arr.length) ? l.changed_fields_arr.join(', ') : '';
      return '<tr>' +
        '<td>' + esc(String(l.ts || '').replace('T', ' ').slice(0, 19)) + '</td>' +
        '<td><span class="badge ' + badgeClassForAction(l.action) + '">' + esc(actionLabel) + '</span></td>' +
        '<td>' + esc(l.entity || '') + '</td>' +
        '<td>' + esc(l.doc_no || '') + '</td>' +
        '<td>' + esc(l.user_email || '') + '</td>' +
        '<td>' + esc(fields) + '</td>' +
        '<td>' + esc(l.reason || '') + '</td>' +
        '</tr>';
    }).join('');
    box.innerHTML = '<div class="table-wrap"><table class="data">' +
      '<thead><tr><th>เวลา</th><th>การกระทำ</th><th>หมวด</th><th>เลขที่</th><th>ผู้ใช้</th><th>ฟิลด์ที่เปลี่ยน</th><th>เหตุผล</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }).catch(function (e) { box.innerHTML = '<p style="color:var(--danger)">' + esc(e.message) + '</p>'; });
}

function badgeClassForAction(action) {
  var map = {
    CREATE: 'badge-confirmed', UPDATE: 'badge-quoted', STATUS_CHANGE: 'badge-production',
    ISSUE_DOC: 'badge-billed', PAYMENT: 'badge-paid', VOID: 'badge-cancelled',
    CANCEL: 'badge-cancelled', PRINT: 'badge-draft', LOGIN: 'badge-draft'
  };
  return map[action] || 'badge-draft';
}
</script>
