<!-- P_Order.html - หน้าใบสั่งจ้าง (initOrderForm, addItemRow, saveOrder, openOrderDetail, cancelOrderPrompt) -->
<script>
// ฟังก์ชันเหล่านี้ถูกเรียกจาก Script.html (SPA) ผ่าน window

function initOrderForm(customers) {
  var custSearch = document.getElementById('cust-search');
  var custList = document.getElementById('cust-list');
  var currentCusts = customers || [];
  var dueDate = document.getElementById('due-date');
  if (dueDate) {
    var d = new Date();
    d.setDate(d.getDate() + 30);
    dueDate.value = d.toISOString().slice(0, 10);
  }
  addItemRow();

  if (custSearch) {
    custSearch.addEventListener('input', function () {
      var kw = this.value.trim().toLowerCase();
      var matched = currentCusts.filter(function (c) {
        return !c.is_active && c.is_active !== true ? false : (String(c.name) + ' ' + String(c.phone)).toLowerCase().indexOf(kw) >= 0;
      }).slice(0, 10);
      if (!kw || !matched.length) {
        custList.style.display = 'none';
        return;
      }
      custList.innerHTML = matched.map(function (c) {
        return '<li data-id="' + c.id + '" data-name="' + c.name + '" data-type="' + c.customer_type + '">' + esc(c.name) + ' (' + esc(c.phone) + ')</li>';
      }).join('');
      custList.style.display = 'block';
      custList.querySelectorAll('li').forEach(function (li) {
        li.addEventListener('click', function () {
          document.getElementById('cust-id').value = this.getAttribute('data-id');
          custSearch.value = this.getAttribute('data-name');
          document.getElementById('sale-mode').value = this.getAttribute('data-type') === 'WHOLESALE' ? 'WHOLESALE' : 'RETAIL';
          custList.style.display = 'none';
        });
      });
    });
    custSearch.addEventListener('blur', function () { setTimeout(function () { custList.style.display = 'none'; }, 200); });
  }
}

function addItemRow() {
  var box = document.getElementById('items-box');
  if (!box) return;
  var row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center';
  row.innerHTML = [
    '<input placeholder="รายละเอียด" class="item-desc">',
    '<input type="number" placeholder="กว้าง (ม.)" class="item-w" value="1">',
    '<input type="number" placeholder="สูง (ม.)" class="item-h" value="1">',
    '<input type="number" placeholder="จำนวน" class="item-qty" value="1">',
    '<input type="number" placeholder="ราคา/ตร.ม." class="item-price">',
    '<input type="number" placeholder="เพิ่มพิเศษ" class="item-extra" value="0">',
    '<input type="text" placeholder="หมายเหตุ" class="item-note">',
    '<button class="btn btn-danger" onclick="this.parentNode.remove();recalc(){return;}">✕</button>'
  ].join('');
  box.appendChild(row);
  row.querySelectorAll('input').forEach(function (inp) {
    inp.addEventListener('input', recalc);
  });
}

function getItems() {
  var rows = document.querySelectorAll('#items-box > div');
  var items = [];
  rows.forEach(function (row) {
    items.push({
      description: row.querySelector('.item-desc').value,
      width_m: row.querySelector('.item-w').value,
      height_m: row.querySelector('.item-h').value,
      qty: row.querySelector('.item-qty').value,
      unit_price: row.querySelector('.item-price').value || null,
      extra_charge: row.querySelector('.item-extra').value,
      extra_note: row.querySelector('.item-note').value
    });
  });
  return items;
}

function recalc() {
  var items = getItems();
  // server-side จะคำนวณจริง แต่สำหรับแสดงสดคำนวณคร่าวๆ ด้วย min_area = 0
  var sub = 0;
  items.forEach(function (it) {
    var w = Number(it.width_m) || 0;
    var h = Number(it.height_m) || 0;
    var q = Number(it.qty) || 1;
    var p = Number(it.unit_price) || 0;
    var ex = Number(it.extra_charge) || 0;
    sub += (Math.max(w * h, 0)) * q * p + ex;
  });
  var discount = Number(document.getElementById('discount') ? document.getElementById('discount').value : 0) || 0;
  var vatMode = document.getElementById('vat-mode') ? document.getElementById('vat-mode').value : 'NONE';
  var wht = Number(document.getElementById('wht') ? document.getElementById('wht').value : 0) || 0;
  var vat = vatMode === 'EXCLUDE' ? sub * 0.07 : (vatMode === 'INCLUDE' ? sub * 7 / 107 : 0);
  var gt = sub - discount + vat - wht;
  var el = document.getElementById('grand-total');
  if (el) el.textContent = fmtMoney(gt);
}

function saveOrder() {
  var custId = document.getElementById('cust-id').value;
  if (!custId) { toast('กรุณาเลือกลูกค้า', 'error'); return; }
  var payload = {
    customer_id: custId,
    sale_mode: document.getElementById('sale-mode').value,
    due_date: document.getElementById('due-date').value,
    discount_amt: document.getElementById('discount').value,
    vat_mode: document.getElementById('vat-mode').value,
    wht_amount: document.getElementById('wht').value,
    items: getItems()
  };
  callServerArgs('createOrder', payload).then(function (res) {
    handleResult(res);
    toast('สร้างใบสั่งจ้างสำเร็จ', 'success');
    setTimeout(function () { location.hash = '#/orders'; }, 600);
  }).catch(function (e) { toast(e.message, 'error'); });
}

function openOrderDetail(orderId) {
  callServerArgs('getOrderDetail', orderId).then(function (res) {
    var data = res.data;
    var order = data.order;
    var items = data.items;
    Swal.fire({
      title: 'ใบสั่งจ้าง ' + order.doc_no,
      html: buildOrderDetailHtml(order, items),
      width: 700,
      showCloseButton: true,
      showConfirmButton: false
    });
  }).catch(function (e) { toast(e.message, 'error'); });
}

function buildOrderDetailHtml(order, items) {
  var rows = items.map(function (it) {
    return '<tr><td>' + esc(it.description) + '</td><td>' + esc(it.width_m) + 'x' + esc(it.height_m) + '</td><td>' + esc(it.qty) + '</td><td>' + esc(it.area_sqm) + '</td><td>' + fmtMoney(it.unit_price) + '</td><td>' + fmtMoney(it.line_total) + '</td></tr>';
  }).join('');
  return [
    '<div style="text-align:left">',
    '<p><strong>ลูกค้า:</strong> ' + esc(order.customer_name) + '</p>',
    '<p><strong>วันที่:</strong> ' + esc(order.order_date) + '</p>',
    '<p><strong>สถานะ:</strong> ' + badgeFor(order.status) + '</p>',
    '<table class="data" style="margin-top:12px;width:100%"><thead><tr><th>รายการ</th><th>ขนาด</th><th>จำนวน</th><th>ตร.ม.</th><th>ราคา</th><th>รวม</th></tr></thead><tbody>' + rows + '</tbody></table>',
    '<div style="margin-top:12px;text-align:right">',
    '<p>รวม: ฿' + fmtMoney(order.subtotal) + '</p>',
    '<p>ภาษี: ฿' + fmtMoney(order.vat_amount) + '</p>',
    '<p><strong>สุทธิ: ฿' + fmtMoney(order.grand_total) + '</strong></p>',
    '</div></div>'
  ].join('');
}

function cancelOrderPrompt(orderId) {
  Swal.fire({
    title: 'ยืนยันการยกเลิก',
    input: 'textarea',
    inputLabel: 'เหตุผลการยกเลิก (ขั้นต่ำ 10 ตัวอักษร)',
    inputPlaceholder: 'ระบุเหตุผล...',
    inputValidator: function (value) {
      if (!value || value.trim().length < 10) return 'เหตุผลต้องยาวอย่างน้อย 10 ตัวอักษร';
    },
    showCancelButton: true,
    confirmButtonText: 'ยืนยันยกเลิก',
    cancelButtonText: 'ปิด',
    confirmButtonColor: '#dc2626'
  }).then(function (result) {
    if (result.isConfirmed) {
      callServerArgs('cancelOrder', orderId, result.value.trim())
        .then(function (res) {
          handleResult(res);
          toast('ยกเลิกสำเร็จ (VOID ทั้งสาย)', 'success');
          setTimeout(function () { navigate('orders'); }, 600);
        })
        .catch(function (e) { toast(e.message, 'error'); });
    }
  });
}
</script>
