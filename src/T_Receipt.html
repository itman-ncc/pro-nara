<!-- T_Receipt.html - เทมเพลตพิมพ์ใบเสร็จ A4 (RULE-07: ต้นฉบับ/สำเนา + ลายน้ำยกเลิก) -->
<style>
  @media print {
    @page { size: A4; margin: 12mm; }
    .no-print { display: none !important; }
    body { font-family: 'Sarabun', sans-serif; }
  }
  .doc-page { max-width: 210mm; margin: 0 auto; padding: 20px; background:#fff; }
  .doc-header { display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:12px; margin-bottom:16px; }
  .doc-title { font-size:26px; font-weight:700; }
  .doc-no { font-size:16px; text-align:right; }
  table.ditems { width:100%; border-collapse:collapse; font-size:14px; }
  table.ditems th, table.ditems td { border:1px solid #000; padding:6px 8px; text-align:left; }
  table.ditems th { background:#f1f5f9; }
  .watermark { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%) rotate(-30deg); font-size:80px; color:rgba(220,38,38,.15); font-weight:800; z-index:99; pointer-events:none; }
  .copy-label { border:2px solid #dc2626; color:#dc2626; font-weight:700; padding:2px 10px; border-radius:4px; display:inline-block; }
</style>
<div id="receipt-doc" class="doc-page"></div>
<button class="btn btn-primary no-print" onclick="window.print()">🖨️ พิมพ์ใบเสร็จ</button>
<script>
function renderReceipt(doc) {
  var snap = doc.snapshot || {};
  var order = snap.order || {};
  var items = snap.items || [];
  var watermark = doc.status === 'VOID' ? '<div class="watermark">ยกเลิก</div>' : '';
  var copyLabel = '';
  if (doc.status !== 'VOID') {
    var pcount = Number(doc.print_count || 1);
    if (pcount === 1) copyLabel = '<span>ต้นฉบับ</span>';
    else copyLabel = '<span class="copy-label">สำเนา ครั้งที่ ' + pcount + '</span>';
  }
  var rows = items.map(function (it) {
    return '<tr><td>' + esc(it.description) + '</td><td>' + esc(it.qty) + '</td><td>' + esc(it.area_sqm) + '</td><td>' + fmtMoney(it.line_total) + '</td></tr>';
  }).join('');
  document.getElementById('receipt-doc').innerHTML = watermark + [
    '<div class="doc-header"><div><div class="doc-title">ใบเสร็จรับเงิน</div><div>ร้านไวนิล</div></div><div class="doc-no"><strong>' + esc(doc.doc_no) + '</strong><br>' + esc(doc.issue_date) + '<br>' + copyLabel + '</div></div>',
    '<p><strong>ลูกค้า:</strong> ' + esc(order.customer_name) + '</p>',
    '<table class="ditems"><thead><tr><th>รายการ</th><th>จำนวน</th><th>ตร.ม.</th><th>รวม</th></tr></thead><tbody>' + rows + '</tbody></table>',
    '<div style="text-align:right;margin-top:12px"><p><strong>ยอดชำระ: ฿' + fmtMoney(order.grand_total) + '</strong></p></div>',
    '<p style="text-align:center;margin-top:24px">รับเงินสด / โอน / เช็ค / บัตร / QR</p>',
    '<p style="text-align:center;margin-top:12px">.......................................................<br>ผู้รับเงิน</p>'
  ].join('');
}
</script>
