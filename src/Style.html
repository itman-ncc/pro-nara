<!-- Style.html - CSS ทั้งหมด (Tailwind + print) -->
<style>
  :root {
    --primary: #1d4ed8;
    --primary-light: #3b82f6;
    --primary-dark: #1e40af;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', 'Kanit', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== Layout ===== */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
    transition: all .15s;
  }

  .nav button:hover { background: var(--bg); }
  .nav button.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ===== Grid ===== */
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 768px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }

  /* ===== Form ===== */
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: 2px solid var(--primary-light);
    outline-offset: -1px;
    border-color: var(--primary-light);
  }

  /* ===== Buttons ===== */
  .btn {
    padding: 9px 16px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== Table ===== */
  .table-wrap { overflow-x: auto; }
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.data th, table.data td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.data th {
    background: var(--bg);
    font-weight: 600;
    color: var(--text-muted);
    font-size: 13px;
  }
  table.data tr:hover td { background: #f8fafc; }

  /* ===== Badge ===== */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-draft { background: #e2e8f0; color: #475569; }
  .badge-quoted { background: #fef3c7; color: #92400e; }
  .badge-confirmed { background: #dbeafe; color: #1e40af; }
  .badge-production { background: #ede9fe; color: #6d28d9; }
  .badge-delivered { background: #dcfce7; color: #166534; }
  .badge-billed { background: #ccfbf1; color: #115e59; }
  .badge-partial { background: #ffedd5; color: #9a3412; }
  .badge-paid { background: #bbf7d0; color: #14532d; }
  .badge-cancelled { background: #fee2e2; color: #991b1b; }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 520px;
    width: 100%;
    padding: 20px;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h3 { margin-bottom: 16px; }

  .stat-card { text-align: center; padding: 16px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    z-index: 200;
    opacity: 0;
    transform: translateY(20px);
    transition: all .2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  .autocomplete-list {
    list-style: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    background: #fff;
    position: absolute;
    width: 100%;
    z-index: 50;
  }
  .autocomplete-list li { padding: 8px 12px; cursor: pointer; font-size: 14px; }
  .autocomplete-list li:hover { background: var(--primary); color: #fff; }

  .pos-relative { position: relative; }

  /* ===== Print ===== */
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');
</style>
