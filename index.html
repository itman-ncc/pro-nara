<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบวางบิลร้านไวนิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1d4ed8;
    --primary-light: #3b82f6;
    --primary-dark: #1e40af;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  /* ===== Login ===== */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
  }
  .login-box {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
  }
  .login-box h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
  .login-box .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .login-box .field { margin-bottom: 16px; }
  .login-box label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .login-box input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .login-box input:focus { outline: 2px solid var(--primary-light); border-color: var(--primary-light); }
  .login-btn {
    width: 100%; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 16px; font-family: inherit; font-weight: 600;
  }
  .login-btn:hover { background: var(--primary-dark); }
  .login-hint { margin-top: 12px; font-size: 12px; color: var(--text-muted); line-height: 1.7; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 44px !important; }
  .pass-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1;
    color: var(--text-muted); padding: 6px; border-radius: 6px;
  }
  .pass-toggle:hover { background: #f1f5f9; color: var(--primary); }
  .member-btn {
    width: 100%; margin-top: 10px; padding: 8px; border: 1px dashed var(--border);
    border-radius: 8px; cursor: pointer; background: transparent; color: var(--text-muted);
    font-size: 13px; font-family: inherit;
  }
  .member-btn:hover { background: var(--bg); color: var(--primary); border-color: var(--primary-light); }
  .captcha-row { display: flex; gap: 8px; align-items: center; }
  .captcha-row canvas { border: 1px solid var(--border); border-radius: 8px; background: #eef2f6; flex: 0 0 auto; }
  .captcha-row input { flex: 1; text-transform: uppercase; letter-spacing: 2px; }
  .captcha-refresh {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 9px 10px; cursor: pointer; font-size: 16px; line-height: 1; color: var(--text-muted);
  }
  .captcha-refresh:hover { background: var(--bg); color: var(--primary); }
  .remember-row {
    display: flex; align-items: center; gap: 7px; margin: 2px 0 12px; font-size: 14px;
    color: var(--text-muted); cursor: pointer; user-select: none;
  }
  .remember-row input { width: auto !important; accent-color: var(--primary); }

  /* ===== App shell ===== */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
  }
  .brand { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .user-chip { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; }
  .user-chip .logout { color: var(--danger); cursor: pointer; font-weight: 600; background:none; border:none; font-family:inherit; font-size:13px; }

  .nav {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--surface); padding: 8px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; z-index: 19;
  }
  .nav button {
    padding: 8px 14px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; color: var(--text-muted);
    transition: all .15s;
  }
  .nav button:hover { background: var(--bg); }
  .nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .app-container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card h3 { margin: 12px 0 8px; }
  .muted { color: var(--text-muted); }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: #fff;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: 2px solid var(--primary-light); outline-offset: -1px; border-color: var(--primary-light);
  }

  .btn { padding: 9px 16px; border: 0; border-radius: 8px; font-size: 15px; font-family: inherit; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); } .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--danger); color: #fff; } .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: var(--success); color: #fff; } .btn-success:hover { background: #15803d; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data th { background: var(--bg); font-weight: 600; color: var(--text-muted); font-size: 13px; }
  table.data tr:hover td { background: #f8fafc; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-draft { background: #e2e8f0; color: #475569; }
  .badge-quoted { background: #fef3c7; color: #92400e; }
  .badge-confirmed { background: #dbeafe; color: #1e40af; }
  .badge-production { background: #ede9fe; color: #6d28d9; }
  .badge-delivered { background: #dcfce7; color: #166534; }
  .badge-billed { background: #ccfbf1; color: #115e59; }
  .badge-partial { background: #ffedd5; color: #9a3412; }
  .badge-paid { background: #bbf7d0; color: #14532d; }
  .badge-cancelled { background: #fee2e2; color: #991b1b; }
  .badge-active { background: #dcfce7; color: #166534; }

  .stat-card { text-align: center; padding: 16px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .pos-relative { position: relative; }
  .autocomplete-list { list-style: none; border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; background: #fff; position: absolute; width: 100%; z-index: 50; }
  .autocomplete-list li { padding: 8px 12px; cursor: pointer; font-size: 14px; }
  .autocomplete-list li:hover { background: var(--primary); color: #fff; }

  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .total-box { background: var(--bg); border-radius: 8px; padding: 12px 16px; font-size: 16px; }

  .items-tbl { width: 100%; font-size: 13px; }
  .items-tbl th { font-size: 12px; white-space: nowrap; }
  .items-tbl td { padding: 7px 8px; vertical-align: top; white-space: normal; }
  .items-tbl .num { text-align: right; white-space: nowrap; }
  .items-tbl .itm-main { font-weight: 600; }
  .items-tbl .itm-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .items-tbl .itm-note { max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .items-tbl .line-amt { font-weight: 700; color: var(--primary); }
  .badge-edit { display: inline-block; font-size: 10px; background: #fef3c7; color: #b45309; border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
  .itm-act { display: flex; gap: 4px; }
  .im-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; text-align: left; font-size: 14px; }
  .im-grid .span2 { grid-column: 1 / -1; }
  .im-grid label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .im-grid input, .im-grid select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
  .im-live { background: var(--bg); border-radius: 8px; padding: 9px 12px; display: flex; justify-content: space-between; font-size: 14px; }


  /* Print template (A4) */
  @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: 100%; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/sweetalert2@11"></script>
<script>
'use strict';

/* ================== CONFIG ================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbxLoXZYwzNwfNCKtjcRafSMVAt-QCCEYHXs3NBDTVjpVGcrJSCTWmLmpWVFH0ijPx98/exec';

var APP = {
  user: null,          // {email, name, role}
  route: 'dashboard',
  products: [],
  customers: [],
  settings: {},        // ข้อมูลร้านค้าจาก Setting sheet
  PAY_CURRENT_ORDER: null,
  ORDER_CACHE: null,
  loggingOut: false   // ป้องกันการ render error จาก request ที่ค้างหลัง logout
};

/* ================== UTIL ================== */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function fmtMoney(n) {
  return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);
}
function toast(msg, type) {
  var icon = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
  Swal.fire({ icon: icon, title: msg, toast: false, timer: 2200, showConfirmButton: false, timerProgressBar: true });
}
function badgeFor(status) {
  var map = {
    DRAFT:['badge-draft','ร่าง'], QUOTED:['badge-quoted','เสนอราคา'], CONFIRMED:['badge-confirmed','ยืนยัน'],
    IN_PRODUCTION:['badge-production','กำลังผลิต'], DELIVERED:['badge-delivered','ส่งของแล้ว'],
    BILLED:['badge-billed','วางบิลแล้ว'], PARTIAL_PAID:['badge-partial','จ่ายบางส่วน'],
    PAID:['badge-paid','ชำระแล้ว'], CANCELLED:['badge-cancelled','ยกเลิก']
  };
  var m = map[status] || ['badge-draft', status];
  return '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
}
function docTypeName(t) {
  return { QUOTATION:'ใบเสนอราคา', DELIVERY:'ใบส่งของ', BILLING:'ใบวางบิล', RECEIPT:'ใบเสร็จ', TAX_INVOICE:'ใบกำกับภาษี' }[t] || t;
}
function session() {
  return { email: APP.user ? APP.user.email : '' };
}
function roleAtLeast(role) {
  var order = { STAFF:1, MANAGER:2, ADMIN:3 };
  return order[APP.user.role] >= (order[role] || 1);
}

/* ================== LOADING (Sweet Alert) ================== */
var LOADING = {
  count: 0,           // จำนวน request ที่ยังค้างอยู่
  shown: false,       // แสดง Sweet Alert loading แล้วหรือยัง
  timer: null,        // ดีเลย์กันกระพริบสำหรับ request ที่จบไว
  label: 'กำลังโหลดข้อมูล...'
};

// ตั้งค่าข้อความ loading ระหว่างการโหลด (สำหรับหน้าจอที่โหลดหลายรอบ)
function loadingMsg() {
  return LOADING.label;
}

function pushLoading() {
  LOADING.count++;
  if (LOADING.shown) return;
  if (LOADING.timer) clearTimeout(LOADING.timer);
  LOADING.timer = setTimeout(showLoading, 120);
}

function showLoading() {
  if (LOADING.count <= 0 || LOADING.shown) return;
  LOADING.shown = true;
  Swal.fire({
    title: loadingMsg(),
    text: 'กรุณารอสักครู่',
    allowOutsideClick: false,
    allowEscapeKey: false,
    didOpen: function () { Swal.showLoading(); },
    didDestroy: function () { LOADING.shown = false; }
  });
}

function popLoading() {
  LOADING.count = Math.max(0, LOADING.count - 1);
  if (LOADING.count > 0) return;
  if (LOADING.timer) clearTimeout(LOADING.timer);
  if (LOADING.shown) Swal.close();
}

/* ================== API HELPER ================== */
async function api(action, payload) {
  pushLoading();
  try {
    var r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload || {}, session: session() })
    });
    var data = await r.json();
    popLoading();
    return data;
  } catch (err) {
    popLoading();
    return { ok: false, data: null, message: 'เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว: ' + err.message };
  }
}
async function mustApi(action, payload) {
  var res = await api(action, payload);
  if (!res || !res.ok) throw new Error((res && res.message) || 'เกิดข้อผิดพลาด');
  return res.data;
}

/* ================== ROUTER ================== */
function navigate(route) {
  APP.route = route;
  var navBtns = document.querySelectorAll('.nav button');
  navBtns.forEach(function (b) { b.classList.remove('active'); });
  var active = document.querySelector('.nav button[data-route="' + route + '"]');
  if (active) active.classList.add('active');

  var renderer = ROUTES[route] || renderDashboard;
  renderer().then(function () {
    if (route !== APP.route) return; // โดดข้ามถ้าเปลี่ยน route ไปแล้ว
    if (APP.loggingOut) return;
    window.scrollTo(0, 0);
  }).catch(function (err) {
    if (APP.loggingOut) return; // หลัง logout แล้วไม่แสดง error ที่ขัดจังหวะหน้า login
    showPage('<div class="card"><h2>เกิดข้อผิดพลาด</h2><p>' + esc(err.message || err) + '</p></div>');
  });
}
var ROUTES = {};

/* ================== APP SHELL ================== */
function buildShell() {
  var app = document.getElementById('app');
  var shopLabel = APP.settings.shopName ? esc(APP.settings.shopName) : 'ระบบวางบิลร้านไวนิล';
  var shopSub = APP.settings.shopPhone ? ' | ' + esc(APP.settings.shopPhone) : '';
  app.innerHTML =
    '<header class="app-header">' +
      '<div class="brand">' + (APP.settings.logoUrl ? '<img src="' + esc(APP.settings.logoUrl) + '" style="height:28px;border-radius:4px">' : '📐') + ' ' + shopLabel + '<span style="font-size:12px;font-weight:400;color:var(--text-muted)">' + shopSub + '</span></div>' +
      '<div class="user-chip"><span>' + esc(APP.user.name) + ' (' + (APP.user.role || '') + ')</span><button class="logout" onclick="doLogout()">ออกจากระบบ</button></div>' +
    '</header>' +
    '<nav class="nav">' +
      '<button data-route="dashboard">แดชบอร์ด</button>' +
      '<button data-route="orders">ใบสั่งจ้าง</button>' +
      '<button data-route="order-form">สร้างใบสั่งจ้าง</button>' +
      '<button data-route="billing">วางบิล/เอกสาร</button>' +
      '<button data-route="payment">รับชำระ</button>' +
      (roleAtLeast('MANAGER') ? '<button data-route="audit">ตรวจสอบ</button>' : '') +
      '<button data-route="customers">ลูกค้า</button>' +
      '<button data-route="settings">ตั้งค่า</button>' +
    '</nav>' +
    '<div id="page" class="app-container"></div>';

  app.querySelectorAll('.nav button').forEach(function (b) {
    b.addEventListener('click', function () { navigate(b.getAttribute('data-route')); });
  });
}
function showPage(html) {
  if (APP.loggingOut) return; // หลัง logout แล้วไม่ต้อง render เข้า shell ที่หายไป
  var page = document.getElementById('page');
  if (page) page.innerHTML = html || '';
}

/* ================== LOGIN ================== */
function renderLogin() {
  document.getElementById('app').innerHTML =
    '<div class="login-wrap"><div class="login-box">' +
      (APP.settings.logoUrl ? '<div style="text-align:center;margin-bottom:12px"><img src="' + esc(APP.settings.logoUrl) + '" style="max-height:80px;border-radius:8px"></div>' : '') +
      '<h1>📐 ' + esc(APP.settings.shopName || 'ระบบวางบิลร้านไวนิล') + '</h1>' +
      '<div class="sub">' + esc(APP.settings.shopAddress || 'เข้าสู่ระบบเพื่อใช้งาน') + '</div>' +
      '<div class="field"><label>อีเมล</label><input id="lg-email" type="email" placeholder="you@shop.com" autocomplete="username"></div>' +
      '<div class="field"><label>รหัสผ่าน</label>' +
        '<div class="pass-wrap">' +
          '<input id="lg-pass" type="password" placeholder="********" autocomplete="current-password">' +
          '<button type="button" class="pass-toggle" id="lg-toggle" onclick="toggleShowPass()" title="แสดง/ซ่อนรหัสผ่าน">👁</button>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>รหัสยืนยัน (กันหุ่นยนต์)</label>' +
        '<div class="captcha-row">' +
          '<canvas id="lg-captcha" width="150" height="44" title="คลิก 🔄 เพื่อสุ่มรหัสใหม่"></canvas>' +
          '<button type="button" class="captcha-refresh" onclick="genCaptcha()" title="สุ่มรหัสใหม่">🔄</button>' +
          '<input id="lg-captcha-in" placeholder="กรอกรหัสในภาพ" autocomplete="off" maxlength="4">' +
        '</div>' +
      '</div>' +
      '<label class="remember-row"><input type="checkbox" id="lg-remember"> จำรหัสผ่านไว้บนเครื่องนี้</label>' +
      '<button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>' +
      '<button type="button" class="member-btn" onclick="toggleMemberHint()">❓ ลืมรหัสผ่าน (ดูบัญชีเริ่มต้น)</button>' +
      '<div class="login-hint" id="lg-member-hint" style="display:none">' +
        'บัญชีเริ่มต้น (หลัง setup):<br>' +
        'admin@pro-nara.com / admin123<br>' +
        'manager@pro-nara.com / manager123<br>' +
        'staff@pro-nara.com / staff123' +
      '</div>' +
    '</div></div>';

  var pass = document.getElementById('lg-pass');
  pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  var capIn = document.getElementById('lg-captcha-in');
  if (capIn) capIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  genCaptcha();

  var rem = null;
  try { rem = JSON.parse(localStorage.getItem('vn_remember') || 'null'); } catch (e) { rem = null; }
  if (rem && rem.email) {
    document.getElementById('lg-email').value = rem.email;
    if (rem.pass) document.getElementById('lg-pass').value = decPass_(rem.pass);
    var cb = document.getElementById('lg-remember'); if (cb) cb.checked = true;
  }
}

var CAPTCHA = { code: '' };
function genCaptcha() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  CAPTCHA.code = code;
  var cv = document.getElementById('lg-captcha');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  ctx.fillStyle = '#eef2f6';
  ctx.fillRect(0, 0, W, H);
  for (var i = 0; i < 5; i++) {
    ctx.strokeStyle = 'rgba(' + Math.floor(Math.random() * 180) + ',' + Math.floor(Math.random() * 180) + ',' + Math.floor(Math.random() * 180) + ',0.45)';
    ctx.lineWidth = 1 + Math.random() * 1.5;
    ctx.beginPath();
    ctx.moveTo(Math.random() * W, Math.random() * H);
    ctx.lineTo(Math.random() * W, Math.random() * H);
    ctx.stroke();
  }
  for (var i = 0; i < 32; i++) {
    ctx.fillStyle = 'rgba(' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',0.5)';
    ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  var colors = ['#1a73e8', '#d93025', '#188038', '#e37400'];
  for (var i = 0; i < code.length; i++) {
    ctx.save();
    ctx.translate(22 + i * 30 + Math.random() * 6, H / 2 + (Math.random() * 8 - 4));
    ctx.rotate((Math.random() - 0.5) * 0.55);
    ctx.font = 'bold 23px Sarabun, Arial, sans-serif';
    ctx.fillStyle = colors[i % colors.length];
    ctx.textBaseline = 'middle';
    ctx.fillText(code.charAt(i), 0, 0);
    ctx.restore();
  }
}
function encPass_(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch (e) { return ''; } }
function decPass_(s) { try { return decodeURIComponent(escape(atob(s))); } catch (e) { return ''; } }
function toggleShowPass() {

async function doLogin() {
  var email = document.getElementById('lg-email').value.trim();
  var password = document.getElementById('lg-pass').value;
  if (!email || !password) { toast('กรุณากรอกอีเมลและรหัสผ่าน', 'error'); return; }
  var capIn = document.getElementById('lg-captcha-in');
  if (!CAPTCHA.code || !capIn || capIn.value.trim().toUpperCase() !== CAPTCHA.code) {
    toast('รหัสยืนยันไม่ถูกต้อง กรุณากรอกใหม่', 'error');
    genCaptcha();
    capIn.value = '';
    if (capIn.focus) capIn.focus();
    return;
  }
  var res = await api('login', { email: email, password: password });
  if (!res || !res.ok) {
    toast((res && res.message) || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
    genCaptcha();
    if (capIn) capIn.value = '';
    return;
  }
  APP.user = res.data;
  APP.loggingOut = false;
  localStorage.setItem('vn_session', email);
  var remCb = document.getElementById('lg-remember');
  if (remCb && remCb.checked) {
    localStorage.setItem('vn_remember', JSON.stringify({ email: email, pass: encPass_(password) }));
  } else {
    localStorage.removeItem('vn_remember');
  }
  boot();
}
function doLogout() {
  APP.loggingOut = true;   // กัน request ที่ค้างอยู่ทำให้หน้า login มี error
  APP.user = null;
  document.getElementById('app').innerHTML =
    '<div class="login-wrap" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="card">กำลังออกจากระบบ...</div></div>';
  localStorage.removeItem('vn_session');
  setTimeout(function () { renderLogin(); }, 150);
}

    }).slice(0, 10);

        document.getElementById('cust-id').value = this.getAttribute('data-id');

  document.getElementById('vat-mode').addEventListener('change', recalc);
  document.getElementById('sale-mode').addEventListener('change', function () {

      var auto = (autoRaw !== null && autoRaw !== '') ? Number(autoRaw) : null;
      var note = String(document.getElementById('im-note').value || '').trim();
      if (!desc) { Swal.showValidationMessage('กรุณากรอกชื่อสินค้า / รายละเอียด'); return false; }
      if (price === null || isNaN(price)) { Swal.showValidationMessage('กรุณาระบุราคา/ตร.ม.'); return false; }
      if (auto !== null && price !== auto && !note) { Swal.showValidationMessage('แก้ไขราคาจากราคาเริ่มต้น — กรุณากรอกหมายเหตุด้วย'); return false; }
      return {
        product_id: (prodVal && prodVal !== '__other__') ? prodVal : null,
        description: desc,
        width_m: document.getElementById('im-w').value,
        height_m: document.getElementById('im-h').value,
        qty: document.getElementById('im-qty').value,
        unit_price: price,
        extra_charge: document.getElementById('im-extra').value,
        note: note,
        auto_price: auto
      };
    }
  }).then(function (result) {
    if (result.isConfirmed && result.value) {
      if (ITEM_EDIT_IDX >= 0) ORDER_ITEMS[ITEM_EDIT_IDX] = result.value;
      else ORDER_ITEMS.push(result.value);
      renderItemsTable();
      recalc();
    }
  });
}

function imLiveCalc() {
  var w = Number(document.getElementById('im-w').value) || 0;
  var h = Number(document.getElementById('im-h').value) || 0;
  var q = Number(document.getElementById('im-qty').value) || 0;
  var p = Number(document.getElementById('im-price').value) || 0;
  var ex = Number(document.getElementById('im-extra').value) || 0;
  var area = Math.max(w * h, 0) * q;
  var areaEl = document.getElementById('im-area'); if (areaEl) areaEl.textContent = fmtMoney(area);
  var lineEl = document.getElementById('im-line'); if (lineEl) lineEl.textContent = fmtMoney(area * p + ex);
}

function renderItemsTable() {
  var tb = document.getElementById('items-tbody');
  if (!tb) return;
  if (!ORDER_ITEMS.length) {
    tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:18px">ยังไม่มีรายการ — กด "+ เพิ่มรายการสินค้า"</td></tr>';
    return;
  }
  tb.innerHTML = ORDER_ITEMS.map(function (it, i) {
    var w = Number(it.width_m) || 0, h = Number(it.height_m) || 0, q = Number(it.qty) || 1;
    var area = Math.max(w * h, 0) * q;
    var overridden = it.auto_price !== null && it.unit_price !== it.auto_price;
    return '<tr>' +
      '<td class="muted">' + (i + 1) + '</td>' +
      '<td><div class="itm-main">' + esc(it.description) + '</div></td>' +
      '<td class="muted">' + w + ' × ' + h + '</td>' +
      '<td class="num">' + q + '</td>' +
      '<td class="num">' + fmtMoney(area) + '</td>' +
      '<td class="num">' + fmtMoney(it.unit_price) + (overridden ? ' <span class="badge-edit">แก้ไขราคา</span>' : '') + '</td>' +
      '<td class="num">' + fmtMoney(Number(it.extra_charge) || 0) + '</td>' +
      '<td class="itm-note" title="' + esc(it.note || '') + '">' + (it.note ? esc(it.note) : '<span class="muted">-</span>') + '</td>' +
      '<td class="num line-amt">' + fmtMoney(itemLineAmount(it)) + '</td>' +
      '<td><div class="itm-act">' +
        '<button class="btn btn-secondary" style="padding:4px 10px" onclick="openItemPopup(' + i + ')" title="แก้ไขรายการ">✏️</button>' +
        '<button class="btn btn-danger" style="padding:4px 10px" onclick="removeItemAt(' + i + ')" title="ลบรายการ">✕</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function removeItemAt(i) {
  ORDER_ITEMS.splice(i, 1);
  renderItemsTable();
  recalc();
}

function itemLineAmount(it) {
  var w = Number(it.width_m) || 0, h = Number(it.height_m) || 0, q = Number(it.qty) || 1, p = Number(it.unit_price) || 0, ex = Number(it.extra_charge) || 0;
  return (Math.max(w * h, 0)) * q * p + ex;
}

async function updateOrder() {
  if (!APP.EDITING_ORDER) { toast('ไม่พบใบสั่งจ้างที่แก้ไข', 'error'); return; }
  var custId = document.getElementById('cust-id').value;
  if (!custId) { toast('กรุณาเลือกลูกค้า', 'error'); return; }
  var items = getItems().filter(function (it) { return it.description; });
  if (!items.length) { toast('กรุณาเพิ่มรายการสินค้า', 'error'); return; }
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var overridden = it.auto_price !== null && it.unit_price !== null && it.unit_price !== it.auto_price;
    if (overridden && !(it.note && String(it.note).trim())) {
      toast('รายการที่ ' + (i + 1) + ' แก้ไขราคา — กรุณากรอกหมายเหตุด้วย', 'error');
      return;
    }
  }
  var payload = {
    id: APP.EDITING_ORDER.id,
    customer_id: custId,
    sale_mode: document.getElementById('sale-mode').value,
    due_date: document.getElementById('due-date').value,
    discount_amt: document.getElementById('discount').value,
    vat_mode: document.getElementById('vat-mode').value,
    wht_amount: document.getElementById('wht').value,
    items: items.map(function (it) {
      return {
        product_id: it.product_id,
        description: it.description,
        width_m: it.width_m,
        height_m: it.height_m,
        qty: it.qty,
        unit_price: it.unit_price,
        extra_charge: it.extra_charge,
        extra_note: it.note
      };
    })
  };
  var res = await api('updateOrder', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'แก้ไขไม่สำเร็จ', 'error'); return; }
  APP.EDITING_ORDER = null;
  toast('แก้ไขใบสั่งจ้าง ' + (res.data ? res.data.doc_no : '') + ' สำเร็จ', 'success');
  setTimeout(function () { navigate('orders'); }, 500);
}

function getItems() {
  return ORDER_ITEMS;
}

function recalc() {
  var sub = 0;
  ORDER_ITEMS.forEach(function (it) { sub += itemLineAmount(it); });
  var dEl = document.getElementById('discount');
  var discount = dEl ? (Number(dEl.value) || 0) : 0;
  var vmEl = document.getElementById('vat-mode');
  var vatMode = vmEl ? vmEl.value : 'NONE';
  var wEl = document.getElementById('wht');
  var wht = wEl ? (Number(wEl.value) || 0) : 0;
  var vat = vatMode === 'EXCLUDE' ? sub * 0.07 : (vatMode === 'INCLUDE' ? sub * 7 / 107 : 0);
  var gt = sub - discount + vat - wht;
  var el = document.getElementById('grand-total'); if (el) el.textContent = fmtMoney(gt);
}

function hasReceipt(docs) {
  return docs.some(function (d) { return ['RECEIPT','TAX_INVOICE'].indexOf(d.doc_type) >= 0 && d.status === 'ACTIVE'; });
}

async function openBillingOrder(orderId) {
  var res = await api('getOrderDetail', { id: orderId });
  if (!res || !res.ok) { toast((res && res.message) || 'ไม่พบใบสั่งจ้าง', 'error'); return; }
  var order = res.data.order;
  var dr = await api('listDocuments', { order_id: orderId });
  var docs = (dr && dr.data) || [];

  var alreadyPaid = order.status === 'PAID';
  var canBill = ['DELIVERED','CONFIRMED','IN_PRODUCTION','BILLED','QUOTED'].indexOf(order.status) >= 0;
  // ออกใบเสร็จได้เมื่อ: ชำระครบแล้ว (PAID) หรือ วางบิล/จ่ายบางส่วนที่ยอดครบ แต่ยังไม่มีใบเสร็จ
  var canReceipt = (alreadyPaid || ['BILLED','PARTIAL_PAID'].indexOf(order.status) >= 0) && Number(order.balance) <= 0.01 && !hasReceipt(docs);

  var docBtns = '';
  if (canBill) docBtns += '<button class="btn btn-primary" id="b-bill">ออกใบวางบิล (BN)</button> ';
  docBtns += '<button class="btn btn-secondary" id="b-delivery">ใบส่งของ (DO)</button> ';
  if (canReceipt) docBtns += '<button class="btn btn-success" id="b-receipt">ออกใบเสร็จ (RC)</button> ';
  if (hasReceipt(docs)) docBtns += '<span class="badge badge-paid">ล็อกแล้ว (มีใบเสร็จ)</span> ';

  var docsTable = docs.length ? '<h4 style="margin:14px 0 8px">เอกสารที่ออกแล้ว</h4><div class="table-wrap"><table class="data"><thead><tr><th>เลขที่</th><th>ประเภท</th><th>วันที่</th><th>พิมพ์</th><th>ยกเลิก</th></tr></thead><tbody>' +
    docs.map(function (d) {
      var printBtn = d.status === 'ACTIVE' ? '<button class="btn btn-secondary btn-sm" onclick="printDoc(\'' + esc(d.id) + '\')">🖨️ พิมพ์</button>' : '<span class="badge badge-cancelled">' + esc(d.status) + '</span>';
      var cancelBtn = d.status === 'ACTIVE' ? '<button class="btn btn-danger btn-sm" onclick="cancelDocPrompt(\'' + esc(d.id) + '\',\'' + esc(d.doc_no) + '\')">ยกเลิก</button>' : '';
      return '<tr><td>' + esc(d.doc_no) + '</td><td>' + docTypeName(d.doc_type) + '</td><td>' + esc(d.issue_date) + '</td><td>' + printBtn + '</td><td>' + cancelBtn + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '';

  Swal.fire({
    title: 'จัดการเอกสาร ' + order.doc_no,
    html: '<div style="text-align:left">' +

async function issueDocType(orderId, docType) {
  var res = await api('issueDocument', { order_id: orderId, doc_type: docType });

    showCloseButton: true,

      document.getElementById('print-now').onclick = function () { printDoc(doc.id); };

function cancelDocPrompt(docId, docNo) {
  Swal.fire({
    title: 'ยกเลิก ' + docNo,

    showCancelButton: true,
    confirmButtonText: 'ยืนยันยกเลิก',
    confirmButtonColor: '#dc2626'
  }).then(function (result) {
    if (result.isConfirmed) {
      api('cancelFromDocument', { id: docId, reason: result.value.trim() }).then(function (res) {
        if (res && res.ok) { toast('ยกเลิก ' + docNo + ' สำเร็จ (VOID ทั้งสาย)', 'success'); navigate('billing'); }
        else toast((res && res.message) || 'ยกเลิกไม่สำเร็จ', 'error');
      });
    }
  });
}

async function printDoc(docId) {
  var res = await api('getDocument', { id: docId });
  if (!res || !res.ok || !res.data) { toast('ไม่พบเอกสาร', 'error'); return; }
  var doc = res.data;
  await api('printDocument', { id: docId });
  renderPrint(doc);
}

  }).join('');

  var html = '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>' + typeName + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">' +

    '.wm { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%) rotate(-30deg); font-size: 90px; color: rgba(220,38,38,.18); font-weight: 800; z-index: 99; pointer-events: none; }' +
    '.btnp { margin-bottom: 14px; padding: 10px 16px; background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }' +
    '.hdr { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; }' +
    '.title { font-size: 26px; font-weight: 700; }' +
    'table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }' +
    'th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; }' +
    'th { background: #f1f5f9; }' +
    '.tot { text-align: right; margin-top: 12px; line-height: 1.7; }' +
    '@media print { .btnp { display: none; } }' +
    '</style></head><body>' +
    '<button class="btnp" onclick="window.print()">🖨️ พิมพ์เอกสาร</button>' + wm +
    '<div class="hdr"><div><div class="title">' + typeName + '</div><div>' + esc(APP.settings.shopName || 'ร้านไวนิล') + '</div>' +
    (APP.settings.shopAddress ? '<div style="font-size:12px">' + esc(APP.settings.shopAddress) + '</div>' : '') +
    (APP.settings.shopPhone ? '<div style="font-size:12px">โทร: ' + esc(APP.settings.shopPhone) + '</div>' : '') +
    (APP.settings.shopTaxId ? '<div style="font-size:12px">เลขผู้เสียภาษี: ' + esc(APP.settings.shopTaxId) + '</div>' : '') +
    '</div><div style="text-align:right"><strong>' + esc(doc.doc_no) + '</strong><br>' + esc(doc.issue_date || '') + '</div></div>' +
    '<p><strong>ลูกค้า:</strong> ' + esc(order.customer_name || '') + '</p>' +
    '<table><thead><tr><th>#</th><th>รายการ</th><th>จำนวน</th><th>พื้นที่</th><th>ราคา</th><th>รวม</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tot">' +
      '<p>รวม: ฿' + fmtMoney(order.subtotal) + '</p>' +
      '<p>ภาษี: ฿' + fmtMoney(order.vat_amount) + '</p>' +
      '<p>หัก ณ ที่จ่าย: ฿' + fmtMoney(order.wht_amount) + '</p>' +
      '<p><strong>สุทธิ: ฿' + fmtMoney(doc.total_amount != null ? doc.total_amount : order.grand_total) + '</strong></p>' +
    '</div>' +
    '<p style="margin-top:12px"><strong>กำหนดชำระ:</strong> ' + esc(doc.due_date || order.due_date || '') + '</p>' +
    (APP.settings.signatoryName ? '<div style="margin-top:40px;text-align:right;padding-right:40px"><div style="border-top:1px solid #000;width:200px;display:inline-block;padding-top:4px">' + esc(APP.settings.signatoryName) + '</div></div>' : '') +
    '</body></html>';

  var w = window.open('', '_blank');
  if (!w) { toast('กรุณาอนุญาตให้เปิดหน้าต่างใหม่', 'error'); return; }

async function loadDueOrders() {
  var custId = document.getElementById('pay-cust').value;
  var box = document.getElementById('due-orders');
  var form = document.getElementById('pay-form');
  if (!custId) { box.innerHTML = ''; form.innerHTML = ''; return; }
  var res = await api('listDueOrders', { customer_id: custId });
  var orders = (res && res.data) || [];
  if (!orders.length) { box.innerHTML = '<p class="muted">ไม่มียอดค้างชำระ</p>'; form.innerHTML = ''; return; }
  var rows = orders.map(function (o) {
    return '<tr><td>' + esc(o.doc_no) + '</td><td>' + esc(o.order_date) + '</td><td>' + fmtMoney(o.grand_total) + '</td><td>' + fmtMoney(o.balance) + '</td><td><button class="btn btn-success btn-sm" onclick="selectOrderToPay(\'' + esc(o.id) + '\')">รับชำระ</button></td></tr>';
  }).join('');
  box.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th>เลขที่</th><th>วันที่</th><th>ยอดรวม</th><th>คงค้าง</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  form.innerHTML = '';
}

async function selectOrderToPay(orderId) {
  var res = await api('getOrderDetail', { id: orderId });
  if (!res || !res.ok) { toast((res && res.message) || 'ไม่พบใบสั่งจ้าง', 'error'); return; }
  var order = res.data.order;
  APP.PAY_CURRENT_ORDER = order;
  var form = document.getElementById('pay-form');
  form.innerHTML =
    '<h3 style="margin:14px 0 8px">รับชำระ ' + esc(order.doc_no) + '</h3>' +
    '<p>ยอดค้างชำระ: <strong>฿' + fmtMoney(order.balance) + '</strong> (ยอดรวม ฿' + fmtMoney(order.grand_total) + ', ชำระแล้ว ฿' + fmtMoney(order.paid_total) + ')</p>' +
    '<div class="grid grid-2" style="margin-top:12px">' +
      '<div class="form-group"><label>จำนวนเงิน (฿)</label><input id="pay-amount" type="number" step="0.01" value="' + order.balance + '" max="' + order.balance + '"></div>' +
      '<div class="form-group"><label>วิธีชำระ</label><select id="pay-method"><option value="CASH">เงินสด</option><option value="TRANSFER">โอน</option><option value="QR">QR</option><option value="CHEQUE">เช็ค</option><option value="CREDIT_CARD">บัตร</option></select></div>' +
      '<div class="form-group"><label>อ้างอิง (เลขที่โอน/เช็ค)</label><input id="pay-ref"></div>' +
      '<div class="form-group"><label>หัก ณ ที่จ่าย (฿)</label><input id="pay-wht" type="number" step="0.01" value="0"></div>' +
      '<div class="form-group" style="grid-column:1/-1"><label>หมายเหตุ</label><input id="pay-note"></div>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="submitPayment()">ยืนยันรับชำระ</button></div>';
}

async function submitPayment() {
  if (!APP.PAY_CURRENT_ORDER) { toast('กรุณาเลือกรายการก่อน', 'error'); return; }
  var amount = Number(document.getElementById('pay-amount').value);
  var balance = Number(APP.PAY_CURRENT_ORDER.balance);
  if (!amount || amount <= 0) { toast('กรุณากรอกจำนวนเงิน', 'error'); return; }
  if (amount > balance + 0.01) { toast('จำนวนเงินเกินยอดคงค้าง (' + fmtMoney(balance) + ')', 'error'); return; }
  var payload = {
    order_id: APP.PAY_CURRENT_ORDER.id,
    amount: amount,
    method: document.getElementById('pay-method').value,
    bank_ref: document.getElementById('pay-ref').value,
    wht_deducted: Number(document.getElementById('pay-wht').value) || 0,
    note: document.getElementById('pay-note').value
  };
  var res = await api('recordPayment', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'รับชำระไม่สำเร็จ', 'error'); return; }
  var extra = '';
  if (res.data && res.data.receipt) extra = '<br>ออกใบเสร็จ <strong>' + esc(res.data.receipt.doc_no) + '</strong> อัตโนมัติ';
  Swal.fire({ icon: 'success', title: 'รับชำระสำเร็จ', html: '<p>รับชำระ ฿' + fmtMoney(amount) + ' เรียบร้อย' + extra + '</p>' });
  loadDueOrders();
}

        '<option value="">ทั้งหมด</option><option>CREATE</option><option>UPDATE</option><option>STATUS_CHANGE</option><option>ISSUE_DOC</option><option>PAYMENT</option><option>VOID</option><option>CANCEL</option><option>PRINT</option><option>LOGIN</option>' +
      '</select></div>' +
      '<div class="form-group" style="min-width:200px;flex:1"><label>คำค้น</label><input id="audit-keyword" placeholder="เลขที่เอกสาร / อีเมล / เหตุผล"></div>' +
      '<div class="form-group"><button class="btn btn-primary" onclick="loadAuditLogs()">ค้นหา</button></div>' +
    '</div>' +
    '<div id="audit-result"></div>' +
    '</div>'
  );
  var kw = document.getElementById('audit-keyword');
  kw.addEventListener('keydown', function (e) { if (e.key === 'Enter') loadAuditLogs(); });
  loadAuditLogs();
};

function auditBadge(action) {
  var map = { CREATE:'badge-confirmed', UPDATE:'badge-quoted', STATUS_CHANGE:'badge-production', ISSUE_DOC:'badge-billed', PAYMENT:'badge-paid', VOID:'badge-cancelled', CANCEL:'badge-cancelled', PRINT:'badge-draft', LOGIN:'badge-draft' };
  return map[action] || 'badge-draft';
}
function auditLabel(action) {
  var map = { CREATE:'สร้าง', UPDATE:'แก้ไข', STATUS_CHANGE:'เปลี่ยนสถานะ', ISSUE_DOC:'ออกเอกสาร', PAYMENT:'รับชำระ', VOID:'ยกเลิก(VOID)', CANCEL:'ยกเลิก', PRINT:'พิมพ์', LOGIN:'เข้าสู่ระบบ' };
  return map[action] || action;
}

async function loadAuditLogs() {
  var box = document.getElementById('audit-result');
  var action = document.getElementById('audit-action').value;
  var keyword = document.getElementById('audit-keyword').value.trim();
  var res = await api('listAuditLogs', { action: action, keyword: keyword, limit: 200 });
  var logs = (res && res.data) || [];
  if (!logs.length) { box.innerHTML = '<p class="muted">ไม่พบประวัติ</p>'; return; }
  var rows = logs.map(function (l) {
    var fields = (l.changed_fields_arr && l.changed_fields_arr.length) ? l.changed_fields_arr.join(', ') : '';
    return '<tr>' +
      '<td>' + esc(String(l.ts || '').replace('T',' ').slice(0,19)) + '</td>' +
      '<td><span class="badge ' + auditBadge(l.action) + '">' + esc(auditLabel(l.action)) + '</span></td>' +
      '<td>' + esc(l.entity || '') + '</td>' +
      '<td>' + esc(l.doc_no || '') + '</td>' +
      '<td>' + esc(l.user_email || '') + '</td>' +
      '<td>' + esc(fields) + '</td>' +
      '<td>' + esc(l.reason || '') + '</td></tr>';
  }).join('');
  box.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th>เวลา</th><th>การกระทำ</th><th>หมวด</th><th>เลขที่</th><th>ผู้ใช้</th><th>ฟิลด์</th><th>เหตุผล</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ================== SETTINGS ================== */
ROUTES.settings = function () {
  return Promise.all([
    api('getSettings', {}),
    api('listUsers', {})
  ]).then(function (res) {
    var settings = (res[0] && res[0].ok) ? res[0].data : {};
    var users = (res[1] && res[1].ok) ? res[1].data : [];
    APP.settings = settings;
    var userRows = users.map(function (u) {
      return '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.role) + '</td><td>' + (u.is_active === 'TRUE' || u.is_active === true ? 'ใช้งาน' : 'ปิด') + '</td><td>' + (u.has_password ? 'มี' : 'ไม่มี') + '</td></tr>';
    }).join('');

    var adminExtra = roleAtLeast('ADMIN')
      ? '<div class="card"><h3>จัดการผู้ใช้</h3>' +
        '<div class="grid grid-3">' +
          '<div class="form-group"><label>อีเมล *</label><input id="u-email"></div>' +
          '<div class="form-group"><label>ชื่อ</label><input id="u-name"></div>' +
          '<div class="form-group"><label>บทบาท</label><select id="u-role"><option value="STAFF">พนักงาน</option><option value="MANAGER">ผู้จัดการ</option><option value="ADMIN">ผู้ดูแล</option></select></div>' +
          '<div class="form-group"><label>รหัสผ่าน (ปล่อยว่าง = คงเดิม)</label><input id="u-pass"></div>' +
          '<div class="form-group"><label>สถานะ</label><select id="u-active"><option value="TRUE">ใช้งาน</option><option value="FALSE">ปิด</option></select></div>' +
          '<div class="form-group" style="align-self:end"><button class="btn btn-primary" onclick="saveUserFromForm()">บันทึกผู้ใช้</button></div>' +
        '</div>' +
        '<div class="table-wrap"><table class="data"><thead><tr><th>อีเมล</th><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th><th>รหัส</th></tr></thead><tbody>' + userRows + '</tbody></table></div>' +
      '</div>'
      : '';

    var shopForm = roleAtLeast('ADMIN')
      ? '<div class="card"><h3>ข้อมูลร้านค้า</h3>' +
        '<div class="grid grid-2">' +
          '<div class="form-group"><label>ชื่อร้าน</label><input id="s-shopName" value="' + esc(settings.shopName || '') + '"></div>' +
          '<div class="form-group"><label>โลโก้ (URL)</label><input id="s-logoUrl" value="' + esc(settings.logoUrl || '') + '" placeholder="https://..."></div>' +
          '<div class="form-group" style="grid-column:1/-1"><label>ที่อยู่</label><input id="s-shopAddress" value="' + esc(settings.shopAddress || '') + '"></div>' +
          '<div class="form-group"><label>เบอร์โทร</label><input id="s-shopPhone" value="' + esc(settings.shopPhone || '') + '"></div>' +
          '<div class="form-group"><label>อีเมล</label><input id="s-shopEmail" value="' + esc(settings.shopEmail || '') + '"></div>' +
          '<div class="form-group"><label>เลขผู้เสียภาษี</label><input id="s-shopTaxId" value="' + esc(settings.shopTaxId || '') + '"></div>' +
        '</div>' +
        '<div class="grid grid-2" style="margin-top:8px">' +
          '<div class="form-group"><label>ชื่อผู้จัดการ</label><input id="s-managerName" value="' + esc(settings.managerName || '') + '"></div>' +
          '<div class="form-group"><label>ชื่อผู้ลงนาม</label><input id="s-signatoryName" value="' + esc(settings.signatoryName || '') + '"></div>' +
        '</div>' +
        '<button class="btn btn-primary" onclick="saveShopSettings()">บันทึกข้อมูลร้านค้า</button>' +
      '</div>'
      : '<div class="card"><h3>ข้อมูลร้านค้า</h3><p class="muted">ต้องมีสิทธิ์ ADMIN เพื่อแก้ไข</p></div>';

    var systemSettings = roleAtLeast('ADMIN')
      ? '<div class="card"><h3>การตั้งค่าระบบ</h3>' +
        '<div class="grid grid-3">' +
          '<div class="form-group"><label>อัตราภาษี (%)</label><input id="s-vatRate" type="number" value="' + esc(settings.vatRate || '7') + '"></div>' +
          '<div class="form-group"><label>วันเรียกเก็บ (IV Claim Days)</label><input id="s-ivClaimDays" type="number" value="' + esc(settings.ivClaimDays || '0') + '"></div>' +
          '<div class="form-group"><label>โหมดงบประมาณ</label><select id="s-fiscalMode"><option value="NONE"' + (settings.fiscalMode === 'NONE' ? ' selected' : '') + '>ไม่ใช้</option><option value="CUSTOM"' + (settings.fiscalMode === 'CUSTOM' ? ' selected' : '') + '>กำหนดเอง</option></select></div>' +
          '<div class="form-group"><label>เดือนเริ่มต้นงบประมาณ</label><input id="s-fiscalStartMonth" type="number" min="1" max="12" value="' + esc(settings.fiscalStartMonth || '1') + '"></div>' +
          '<div class="form-group"><label>วันเริ่มต้นงบประมาณ</label><input id="s-fiscalStartDay" type="number" min="1" max="31" value="' + esc(settings.fiscalStartDay || '1') + '"></div>' +
          '<div class="form-group"><label>ชื่อโฟลเดอร์ PDF</label><input id="s-pdfFolderName" value="' + esc(settings.pdfFolderName || '') + '"></div>' +
        '</div>' +
        '<button class="btn btn-primary" onclick="saveSystemSettings()">บันทึกการตั้งค่าระบบ</button>' +
      '</div>'
      : '';

    showPage(
      shopForm +
      adminExtra +
      systemSettings +
      '<div class="card"><h3>อื่นๆ</h3>' +
      '<button class="btn btn-secondary" onclick="manualBackup()">💰 สำรองข้อมูลตอนนี้ (Backup)</button> ' +
      (roleAtLeast('ADMIN') ? '<button class="btn btn-secondary" onclick="setupSystem()">⚙️ รัน Setup (สร้างชีต)</button> ' : '') +
      '<button class="btn btn-secondary" onclick="changeMyPassword()">🔑 เปลี่ยนรหัสผ่าน</button>' +
      '</div>'
    );
  });
};

async function saveShopSettings() {
  var payload = {
    shopName: document.getElementById('s-shopName').value,
    logoUrl: document.getElementById('s-logoUrl').value,
    shopAddress: document.getElementById('s-shopAddress').value,
    shopPhone: document.getElementById('s-shopPhone').value,
    shopEmail: document.getElementById('s-shopEmail').value,
    shopTaxId: document.getElementById('s-shopTaxId').value,
    managerName: document.getElementById('s-managerName').value,
    signatoryName: document.getElementById('s-signatoryName').value
  };
  var res = await api('saveSettings', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'บันทึกไม่สำเร็จ', 'error'); return; }
  APP.settings = res.data;
  toast('บันทึกข้อมูลร้านค้าสำเร็จ', 'success');
  buildShell();
}

async function saveSystemSettings() {
  var payload = {
    vatRate: document.getElementById('s-vatRate').value,
    ivClaimDays: document.getElementById('s-ivClaimDays').value,
    fiscalMode: document.getElementById('s-fiscalMode').value,
    fiscalStartMonth: document.getElementById('s-fiscalStartMonth').value,
    fiscalStartDay: document.getElementById('s-fiscalStartDay').value,
    pdfFolderName: document.getElementById('s-pdfFolderName').value
  };
  var res = await api('saveSettings', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'บันทึกไม่สำเร็จ', 'error'); return; }
  APP.settings = res.data;
  toast('บันทึกการตั้งค่าระบบสำเร็จ', 'success');
}

async function saveNewCustomer() {
  var name = document.getElementById('nc-name').value.trim();
  if (!name) { toast('กรุณากรอกชื่อลูกค้า', 'error'); return; }
  var payload = {
    name: name,
    customer_type: document.getElementById('nc-type').value,
    phone: document.getElementById('nc-phone').value,
    tax_id: document.getElementById('nc-tax').value,
    credit_days: document.getElementById('nc-credit').value,
    address: document.getElementById('nc-addr').value
  };
  var res = await api('createCustomer', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'สร้างลูกค้าไม่สำเร็จ', 'error'); return; }
  toast('สร้างลูกค้า ' + res.data.code + ' สำเร็จ', 'success');
  APP.customers = (await mustApi('searchCustomers', { key: '' })) || [];
  navigate('customers');
}

async function saveUserFromForm() {
  var email = document.getElementById('u-email').value.trim();
  if (!email) { toast('กรุณากรอกอีเมลผู้ใช้', 'error'); return; }
  var payload = {
    email: email,
    name: document.getElementById('u-name').value,
    role: document.getElementById('u-role').value,
    is_active: document.getElementById('u-active').value,
    password: document.getElementById('u-pass').value
  };
  var res = await api('saveUser', payload);
  if (!res || !res.ok) { toast((res && res.message) || 'บันทึกผู้ใช้ไม่สำเร็จ', 'error'); return; }
  toast(res.message || 'บันทึกผู้ใช้สำเร็จ', 'success');
  navigate('settings');
}

async function manualBackup() {
  var res = await api('manualBackup', {});
  if (res && res.ok) toast(res.message || 'สำรองข้อมูลสำเร็จ', 'success');
  else toast((res && res.message) || 'สำรองข้อมูลไม่สำเร็จ', 'error');
}

async function setupSystem() {
  var res = await api('setupAll', {});
  if (res && res.ok) { toast(res.message, 'success'); location.reload(); }
  else toast((res && res.message) || 'Setup ไม่สำเร็จ', 'error');
}

function changeMyPassword() {
  Swal.fire({
    title: 'เปลี่ยนรหัสผ่าน',
    html:
      '<div style="text-align:left"><div class="form-group"><label>รหัสผ่านเดิม</label><input id="op" type="password"></div>' +
      '<div class="form-group"><label>รหัสผ่านใหม่</label><input id="np" type="password"></div></div>',
    showCancelButton: true,
    confirmButtonText: 'เปลี่ยน',
    preConfirm: async function () {
      var oldPwd = document.getElementById('op').value;
      var newPwd = document.getElementById('np').value;
      var res = await api('changePassword', { email: APP.user.email, old_password: oldPwd, new_password: newPwd });
      if (!res || !res.ok) { Swal.showValidationMessage((res && res.message) || 'เปลี่ยนรหัสไม่สำเร็จ'); return false; }
      return true;
    }
  }).then(function (result) {
    if (result.isConfirmed) toast('เปลี่ยนรหัสผ่านสำเร็จ', 'success');
  });
}

/* ================== INIT ================== */
(async function init() {
  var savedEmail = localStorage.getItem('vn_session');
  if (savedEmail) {
    var res = await api('whoAmI', { email: savedEmail });
    if (res && res.ok && res.data && (res.data.is_active === 'TRUE' || res.data.is_active === true)) {
      APP.user = res.data;
      boot();
      return;
    }
    localStorage.removeItem('vn_session');
  }
  renderLogin();
})();
</script>
