name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static shell (embed Apps Script Web App via iframe)
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="th">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ระบบวางบิลร้านไวนิล</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              html, body { height: 100%; }
              body {
                font-family: 'Sarabun', 'Kanit', -apple-system, 'Segoe UI', sans-serif;
                background: #f1f5f9;
              }
              .frame-wrap {
                position: fixed; inset: 0;
                display: flex;
              }
              iframe {
                width: 100%; height: 100%;
                border: 0;
              }
            </style>
          </head>
          <body>
            <div class="frame-wrap">
              <iframe
                src="https://script.google.com/macros/s/AKfycbyqpJeuccL3zJMLcMFGc8smrccPL2amcjSYC3IvCI61oiYzK8YUiq-uLIfjE_ysbm_V/exec"
                title="ระบบวางบิลร้านไวนิล"
                allowfullscreen
              ></iframe>
            </div>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
