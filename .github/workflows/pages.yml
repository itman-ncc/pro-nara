name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static shell for GitHub Pages
        run: |
          mkdir -p _site
          # ใช้ Index/Style/Script เป็น SPA shell เพื่อรองรับการเข้าผ่าน GitHub Pages
          # (ส่วนที่เรียก google.script.run ต้องเข้าผ่าน Web App URL จริง)
          cp src/Index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
