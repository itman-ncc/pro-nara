name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build landing page (redirect to Apps Script Web App)
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="th">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ระบบวางบิลร้านไวนิล</title>
            <meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbxLoXZYwzNwfNCKtjcRafSMVAt-QCCEYHXs3NBDTVjpVGcrJSCTWmLmpWVFH0ijPx98/exec">
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Sarabun', 'Kanit', -apple-system, 'Segoe UI', sans-serif;
                background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
                color: #fff;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
              }
              .box { max-width: 520px; padding: 40px 24px; }
              .brand { font-size: 30px; font-weight: 700; margin-bottom: 12px; }
              .sub { font-size: 16px; opacity: .9; margin-bottom: 28px; line-height: 1.6; }
              a.btn {
                display: inline-block;
                padding: 14px 28px;
                background: #fff;
                color: #1e40af;
                font-weight: 700;
                font-size: 17px;
                border-radius: 8px;
                text-decoration: none;
                box-shadow: 0 4px 16px rgba(0,0,0,.2);
              }
              .note { margin-top: 22px; font-size: 13px; opacity: .8; }
            </style>
          </head>
          <body>
            <div class="box">
              <div class="brand">ระบบวางบิลร้านไวนิล</div>
              <div class="sub">กำลังนำคุณไปยังระบบ...<br>หากไม่ถูกนำไปอัตโนมัติ กรุณากดปุ่มด้านล่าง</div>
              <a class="btn" href="https://script.google.com/macros/s/AKfycbxLoXZYwzNwfNCKtjcRafSMVAt-QCCEYHXs3NBDTVjpVGcrJSCTWmLmpWVFH0ijPx98/exec" target="_blank" rel="noopener">เปิดระบบ</a>
              <div class="note">ระบบเป็น Google Apps Script Web App ต้องเข้าสู่ระบบด้วย Gmail ที่อยู่ในระบบ</div>
            </div>
          </body>
          </html>
          HTMLEOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
